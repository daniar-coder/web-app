<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>z-store x | shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #000; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .header { text-align: center; margin-bottom: 20px; }
        .card { background: #1c1c1e; border: 1px solid #333; border-radius: 20px; padding: 20px; margin-bottom: 12px; width: 95%; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        .stars { font-size: 18px; font-weight: bold; }
        .price { color: #ffd700; font-size: 16px; }
        .buy-btn { background: #007aff; border: none; color: #fff; padding: 10px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        /* экран оплаты */
        #payment-screen { display: none; width: 100%; flex-direction: column; align-items: center; text-align: center; }
        .reks-box { background: #1c1c1e; padding: 25px; border-radius: 25px; width: 90%; border: 1px solid #007aff; margin: 20px 0; box-sizing: border-box; }
        .phone { font-size: 22px; color: #007aff; font-weight: bold; cursor: pointer; margin: 10px 0; }
        .confirm-btn { background: #28a745; color: #fff; border: none; padding: 15px; border-radius: 12px; width: 90%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .back-btn { color: #888; margin-top: 20px; cursor: pointer; text-decoration: underline; font-size: 14px; }
    </style>
</head>
<body>
    <div id="main-screen">
        <div class="header">
            <h1>🚀 z-store x</h1>
            <p>лучший курс: 1.65₽ за 1 ⭐</p>
        </div>

        <div class="card">
            <div class="stars">50 ⭐</div>
            <div class="price">83₽</div>
            <button class="buy-btn" onclick="openPay(50, 83)">купить</button>
        </div>
        <div class="card">
            <div class="stars">100 ⭐</div>
            <div class="price">165₽</div>
            <button class="buy-btn" onclick="openPay(100, 165)">купить</button>
        </div>
        <div class="card">
            <div class="stars">250 ⭐</div>
            <div class="price">413₽</div>
            <button class="buy-btn" onclick="openPay(250, 413)">купить</button>
        </div>
        <div class="card">
            <div class="stars">500 ⭐</div>
            <div class="price">825₽</div>
            <button class="buy-btn" onclick="openPay(500, 825)">купить</button>
        </div>
        <div class="card">
            <div class="stars">1000 ⭐</div>
            <div class="price">1650₽</div>
            <button class="buy-btn" onclick="openPay(1000, 1650)">купить</button>
        </div>
    </div>

    <div id="payment-screen">
        <h2>💳 оплата заказа</h2>
        <p id="order-details" style="color: #ffd700; font-weight: bold;"></p>
        <div class="reks-box">
            <p style="color: #888; font-size: 14px; margin-bottom: 5px;">перевод по сбп (т-банк):</p>
            <div class="phone" onclick="copyNum()">+79502074778</div>
            <p style="color: #007aff; font-size: 11px; margin-top: 5px;">нажми на номер, чтобы скопировать</p>
        </div>
        <button class="confirm-btn" onclick="sendToBot()">✅ я оплатил(а)</button>
        <div class="back-btn" onclick="goBack()">назад к выбору</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let currentPack = { stars: 0, price: 0 };

        function openPay(stars, price) {
            currentPack = { stars, price };
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('payment-screen').style.display = 'flex';
            document.getElementById('order-details').innerText = `выбрано: ${stars} ⭐ за ${price}₽`;
        }

        function goBack() {
            document.getElementById('main-screen').style.display = 'block';
            document.getElementById('payment-screen').style.display = 'none';
        }

        function copyNum() {
            navigator.clipboard.writeText('+79502074778');
            tg.showAlert('номер скопирован!');
        }

        function sendToBot() {
            // отправляем данные и закрываем приложение
            tg.sendData(`pay_confirm_${currentPack.stars}_${currentPack.price}`);
            tg.close();
        }
    </script>
</body>
</html>

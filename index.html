<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .btn { background: #007aff; color: #fff; padding: 15px; border-radius: 10px; display: block; margin: 10px; cursor: pointer; font-weight: bold; border: none; width: 100%; }
        #pay { display: none; }
    </style>
</head>
<body>
    <div id="shop">
        <h2>🚀 Z-Store X</h2>
        <div class="card">
    <div class="stars">50 ⭐</div>
    <div class="price">83₽</div>
    <button class="buy-btn" onclick="openPay(50, 83)">купить</button>
</div>
<div class="card">
    <div class="stars">250 ⭐</div>
    <div class="price">413₽</div>
    <button class="buy-btn" onclick="openPay(250, 413)">купить</button>
</div>
        <button class="btn" onclick="openPay(100, 165)">100 ⭐ — 165₽</button>
        <button class="btn" onclick="openPay(500, 825)">500 ⭐ — 825₽</button>
    </div>
    <div id="pay">
        <h3>💳 Оплата</h3>
        <p>Перевод СБП: <b>+79502074778</b></p>
        <button class="btn" style="background:#28a745" onclick="send()">✅ Я ОПЛАТИЛ(А)</button>
    </div>
    <script>
        let tg = window.Telegram.WebApp;
        let data = "";
        function openPay(s, p) {
            data = `pay_confirm_${s}_${p}`;
            document.getElementById('shop').style.display = 'none';
            document.getElementById('pay').style.display = 'block';
        }
        function send() {
            tg.sendData(data); // ОТПРАВКА ДАННЫХ
            tg.close();
        }
    </script>
</body>
</html>
